<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050a10">
  <meta name="description" content="L Capital — Under Construction">
  <title>L Capital — Under Construction</title>
  <style>
    :root {
      color-scheme: dark;
      --text: #f4f6fa;
      --muted: #b4bfcd;
      --accent: #a8d4ff;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #050a10;
      color: var(--text);
      font-family: Inter, "Helvetica Neue", Arial, sans-serif;
      position: relative;
      isolation: isolate;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background: url("l-capital-hero.png") right center / auto 100% no-repeat;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(90deg, rgba(3, 8, 14, .97) 0%, rgba(3, 8, 14, .88) 31%, rgba(3, 8, 14, .48) 56%, rgba(3, 8, 14, .05) 100%),
        linear-gradient(0deg, rgba(3, 8, 14, .42), transparent 35%);
      pointer-events: none;
    }
    header {
      width: 100%;
      padding: clamp(24px, 4vw, 48px) clamp(24px, 7vw, 100px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      line-height: 0;
    }
    .brand-logo {
      height: clamp(52px, 6vw, 72px);
      width: auto;
      max-width: 100%;
      object-fit: contain;
      display: block;
      mix-blend-mode: screen;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #9e9276;
      font-size: 10px;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    .status::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px rgba(156, 201, 244, .9);
    }
    main {
      width: min(1100px, 100%);
      margin: auto 0;
      padding: 50px clamp(24px, 7vw, 100px) 90px;
    }
    .eyebrow {
      margin: 0 0 24px;
      color: var(--accent);
      font-size: 11px;
      letter-spacing: .32em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 760px;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(48px, 8vw, 104px);
      font-weight: 400;
      line-height: .98;
      letter-spacing: -.045em;
    }
    h1 span {
      display: block;
      color: #9e9276;
      -webkit-text-stroke: 0;
    }
    .rule {
      width: 88px;
      height: 1px;
      margin: 34px 0 22px;
      background: linear-gradient(90deg, var(--accent), transparent);
    }
    .message {
      margin: 0;
      color: var(--muted);
      font-size: clamp(14px, 1.4vw, 17px);
      line-height: 1.8;
      letter-spacing: .02em;
    }
    footer {
      padding: 24px clamp(24px, 7vw, 100px);
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: #8e9baa;
      font-size: 10px;
      letter-spacing: .16em;
      text-transform: uppercase;
      border-top: 1px solid rgba(190, 214, 238, .14);
    }
    @media (max-width: 600px) {
      body { overflow: auto; min-height: 100svh; }
      body::before {
        background-position: 58% center;
        background-size: auto 75%;
        opacity: .75;
      }
      body::after {
        background: linear-gradient(90deg, rgba(3, 8, 14, .94), rgba(3, 8, 14, .52)),
                    linear-gradient(0deg, #050a10 0%, transparent 70%);
      }
      header { align-items: flex-start; }
      .status { font-size: 8px; letter-spacing: .1em; text-align: right; }
      main { padding-top: 100px; padding-bottom: 120px; }
      h1 { font-size: clamp(43px, 13vw, 68px); }
      footer { flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="logo.jpeg" alt="L Capital" class="brand-logo">
    </div>
    <div class="status">Website in progress</div>
  </header>

  <main>
    <p class="eyebrow">Investment · Strategy · Growth</p>
    <h1>Under <span>Construction.</span></h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="message">We’re building something meaningful.<br>Our new website will be available soon.</p>
  </main>

  <footer>
    <span>L Capital</span>
    <span>Building value for what’s next</span>
  </footer>
</body>
</html>
